name: dayaa_client
description: "دعاية Dayaa — تطبيق العميل: طلبياته وتصاميمه وحسابه."
publish_to: "none"

# major.minor.patch+build — the build number is what the stores order releases by.
version: 0.1.0+1

environment:
  sdk: ^3.12.0

# Every dependency is a decision. Nothing is added here "in case we need it" — a package that
# is not imported anywhere gets removed, because each one is code we ship, review and upgrade.
#
# This list is the staff app's, minus everything no code here imports yet: Firebase and push,
# flutter_map, the PDF and QR stack, the launcher-icon and splash generators. Each of those
# comes back the day a feature needs it, with the note explaining why — copy the note too.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── state ────────────────────────────────────────────────────────────────────
  flutter_bloc: ^9.1.0 # Cubit — the ViewModel layer
  get_it: ^8.0.3 # service locator

  # ── network ──────────────────────────────────────────────────────────────────
  dio: ^5.8.0+1
  # Debug builds only, whatever the flavour — see DioClient.logsTraffic. Bodies carry the
  # bearer token and real customer records, so a shipped build must never attach it.
  pretty_dio_logger: ^1.4.0

  # ── navigation ───────────────────────────────────────────────────────────────
  go_router: ^15.1.1

  # ── models ───────────────────────────────────────────────────────────────────
  freezed_annotation: ^3.1.0 # unions + immutable data
  json_annotation: ^4.12.0 # json_serializable warns on anything older
  dartz: ^0.10.1 # Either<Failure, T>

  # ── storage ──────────────────────────────────────────────────────────────────
  # The token lives in the Keychain / Android Keystore, not in SharedPreferences:
  # a bearer token is a credential, and prefs are plain-text XML on a rooted device.
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3 # non-secret preferences only

  # ── ui ───────────────────────────────────────────────────────────────────────
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  # One floating button that opens into the two or three things a screen can do. Chosen over a
  # row of buttons or an overflow menu because the actions here are reversible and frequent, and
  # an overflow menu hides them behind a glyph nobody presses.
  flutter_speed_dial: ^7.0.0
  # شريط الإعلانات أعلى الرئيسية: تقليبٌ تلقائي يتوقف تحت الإصبع، ويلتفّ من الأخير إلى الأول.
  # الحزمة نفسها التي في تطبيق بريمولا. **`enlargeCenterPage` مطفأٌ ويبقى مطفأً**: هو الخيار
  # الوحيد فيها الذي يكبّر ويصغّر، وقواعد الحركة لا تسمح إلا بالإزاحة والشفافية (RULES §7).
  carousel_slider: ^5.1.2
  # الشريط السفلي العائم، أيقوناتٍ بلا كلمات. **بلا نصٍّ لا يتحرك فيه إلا لونان**: خلفية الأيقونة
  # النشطة تظهر بالتلاشي ولونها يتبدّل. أما النصّ فيه فيفتح الزرّ عرضاً، ولذلك لا يُمرَّر له أبداً.
  # فُحصت بدائلها قبل اختيارها: `water_drop_nav_bar` و`stylish_bottom_bar` تكبّران الأيقونة.
  google_nav_bar: ^5.0.7
  # شريط الخطوتين أعلى السلة: «المنتجات» ثم «بيانات الطلب». الحزمة نفسها التي يرسم بها تطبيق بريمولا
  # معالجَه. **`showLoadingAnimation` مطفأٌ و`disableScroll` مفعّل، ويبقيان كذلك**: الأول رسمُ Lottie
  # يدور داخل الخطوة النشطة بلا توقّف، والثاني تمريرٌ متحرّك إليها — وكلاهما حركةٌ لا تسمح بها قواعد
  # الحركة (RULES §7). بهما لا يعمل في الشريط أيُّ Ticker.
  easy_stepper: ^0.8.5+1

  # ── getting a file off the phone ─────────────────────────────────────────────
  # Two pickers, not one, and that is not duplication. `file_picker` opens the system's document
  # browser — Files on iOS, the storage picker on Android — which is where a PDF sent by email
  # lands. `image_picker` opens the photo library and the camera, which is where a design sent
  # over WhatsApp lands, and on iOS the Files app cannot see that library at all. Offering only
  # the first would make the commonest case — «أرسله لي على واتساب» — impossible.
  #
  # Both are what the sheet in core/widgets/attachment_sheet.dart puts behind its three rows.
  # `image_picker` is flutter.dev's own; `file_picker` is MIT.
  file_picker: ^11.0.3
  image_picker: ^1.2.3
  # Hands a file to whatever the phone already opens PDFs with.
  #
  # Deliberately not a PDF renderer: every one of them ships a native engine, and this app needs
  # to *show a file*, not to annotate one. The link is the signed URL the API mints per request,
  # so it expires — which is the point.
  url_launcher: ^6.3.2
  # يسلّم ملفاً **على الهاتف** لعارضه: ملفُّ PDF نُزّل من محادثة الدعم يُفتح في معاينة iOS نفسها
  # داخل التطبيق، وفي عارض PDF على أندرويد. `url_launcher` يفتح روابط لا ملفات: iOS لا يفتح
  # مسار ملفٍّ من صندوق التطبيق، وأندرويد يمنع `file://` بلا FileProvider.
  #
  # **`open_file` لا `open_filex`**، والفرق في ما يضيفانه إلى البناء: `open_filex` بـCocoaPods
  # وحدها، ويضيف إلى أندرويد أذوناتِ قراءة التخزين والصور والفيديو — أذوناتٌ يسأل عنها متجر Play
  # ولا حاجة لنا بها. `open_file` يدعم Swift Package Manager على iOS، ولا يضيف إلا FileProvider.
  open_file: ^4.0.0
  # Handing a generated file to the system's own share sheet, where «حفظ الصورة» and «حفظ في
  # الملفات» are rows the OS provides. Deliberately not a gallery-writing package (gal,
  # image_gallery_saver): those need the photo-library permission on both platforms, and a
  # customer who only wanted to send their QR code to the printer should not meet a permission
  # prompt to do it.
  share_plus: ^12.0.2
  # Where that temporary file goes. Declared because our own code names it, which is what
  # `depend_on_referenced_packages` is for.
  path_provider: ^2.1.6

  # ── الأدوات: رمز QR ──────────────────────────────────────────────────────────
  # The encoder alone: pure Dart, BSD-3, from kevmoo, and what every QR package on pub is built
  # on.
  #
  # **Not `qr_flutter`.** It is a ready-made widget carrying its own colours and corners, and
  # RULES §7 does not allow a colour written into a screen — and this tool needs a transparent
  # background and an ink the customer picks, so the ready-made widget would have to be wrapped
  # rather than used. Its last release was 2021. What we need from it is thirty lines of
  # `CustomPainter` that we own and test.
  qr: ^3.0.2

  # ── misc ─────────────────────────────────────────────────────────────────────
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  # أيقونات SVG لما لا تملكه Material ولا Cupertino، وأولها عربة «سلتك» المرسومة على مثالٍ أرسله
  # المستخدم (assets/icons/cart.svg). من فريق Flutter نفسه، ودارت خالصة بلا كودٍ أصلي على iOS.
  flutter_svg: ^2.3.0
  # ── البثّ الحيّ ─────────────────────────────────────────────────────────────
  # عميلُ بروتوكول Pusher الذي يتكلمه Reverb — تذاكر الدعم حيّة. Dart خالصة بلا كودٍ أصلي، وناشرٌ
  # موثّق. لا تعرفه الشاشات: فوقه `RealtimeClient` في core/realtime، فلو تبدّلت الحزمة تبدّل ملفٌ واحد.
  # ولماذا مقابس لا سؤالٌ كل ثوانٍ ولا FCM: Docs/support/SUPPORT-REALTIME.md §١.
  dart_pusher_channels: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  freezed: ^3.2.5
  json_serializable: ^6.9.5
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

# The launcher icon, generated from the one logo.
#
# `flutter_native_splash` is **not** here yet, unlike the staff app, where the two configs sit
# together. That generator draws `logo.png` on a solid colour at startup, and this app has no
# splash screen of its own for it to hand over to — a native splash with nothing behind it is a
# second, different first frame. See BACKLOG.md.
#
# After changing the logo:
#   python tool/make_branding_assets.py
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  # The composed artwork, edge to edge. 1024 because that is the size iOS requires — see the
  # note in the script about the master being 512.
  image_path: assets/branding/icon_1024.png

  android: true
  # The mark alone. The navy it was drawn on becomes the layer below, so a launcher masking this
  # to a circle cuts navy rather than the artwork's corners. The script explains the cut.
  adaptive_icon_foreground: assets/branding/adaptive_foreground.png
  # The artwork's own background, not `theme.dart`'s `surface` (`#0F2138`). Half a shade apart,
  # and the seam shows on a large icon.
  adaptive_icon_background: "#16243c"
  # The app's real floor: `flutter.minSdkVersion` in Flutter 3.44 is 24, not 21. This is what
  # decides whether the generator writes the old mipmap icons beside the adaptive ones — without
  # it, Android 7 (API 24‑25, below 26) shows an empty icon, because `mipmap-anydpi-v26` is
  # invisible to anything under 26.
  min_sdk_android: 24

  ios: true
  # iOS refuses an icon with transparency — it renders as black. This artwork is opaque, so the
  # flag changes nothing today; it is here so the day a logo arrives with an alpha channel does
  # not cost a release.
  remove_alpha_ios: true
  background_color_ios: "#16243c"

flutter:
  uses-material-design: true

  assets:
    # One per Flavor, and both have to be listed: a flavour whose env file is not bundled
    # throws at launch rather than failing the build.
    - .env
    - .env.dev
    # أيقونات SVG تُرسم بلون `IconTheme` كأي `Icon` — انظر `SvgIcon`.
    - assets/icons/
    # رسوم SVG بألوانٍ بديلة تُستبدل بألوان الثيم، كالسلة الفارغة — انظر `EmptyBasket`.
    - assets/illustrations/
    # The five bags «معاينة على الكيس» draws on. ~130 KB the whole set, and they never change —
    # bundled rather than fetched so the tool works on a phone with no signal, which is where a
    # customer standing in a shop deciding on a size usually is.
    - assets/mockups/
    # إعلانات التطبيق الثلاثة: تملأ شريط الرئيسية ما دام المتجر لا يعرض إعلاناً حقيقياً. محزومةٌ
    # لا مجلوبة، لأنها تظهر بالضبط حين لم يصل من الخادم شيء.
    - assets/billboards/
    # رخصة Cairo (SIL OFL 1.1) تُرفق بالخط حيث يُوزَّع، وتُسجَّل في `main.dart`.
    - assets/fonts/OFL.txt

  # خط التطبيق بأوزانه الستة الحقيقية، محزوماً لا مجلوباً. `google_fonts` كان يسجّل كل وزنٍ عائلةً
  # مستقلة، فيُرسم كل خطٍّ عريضٍ في التطبيق عادياً مُثخَّناً بالحساب — أنحف مما رسمه التصميم. هنا
  # العائلة واحدة، فيجد `FontWeight.w700` وجهَ Bold نفسه. ≈١ ميجابايت، ويعمل بلا شبكة من أول فتح.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
