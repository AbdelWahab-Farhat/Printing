name: printing
description: "تطبيق Printing — أكياس مطبوعة حسب الطلب."
publish_to: "none"

# major.minor.patch+build — the build number is what the stores order releases by.
version: 0.1.0+1

environment:
  sdk: ^3.12.0

# Every dependency is a decision. Nothing is added here "in case we need it" — a package that
# is not imported anywhere gets removed, because each one is code we ship, review and upgrade.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── state ────────────────────────────────────────────────────────────────────
  flutter_bloc: ^9.1.0 # Cubit — the ViewModel layer
  get_it: ^8.0.3 # service locator

  # ── network ──────────────────────────────────────────────────────────────────
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0 # dev flavor only

  # ── navigation ───────────────────────────────────────────────────────────────
  go_router: ^15.1.1

  # ── models ───────────────────────────────────────────────────────────────────
  freezed_annotation: ^3.1.0 # unions + immutable data
  json_annotation: ^4.12.0 # json_serializable warns on anything older
  dartz: ^0.10.1 # Either<Failure, T>

  # ── storage ──────────────────────────────────────────────────────────────────
  # The token lives in the Keychain / Android Keystore, not in SharedPreferences:
  # a bearer token is a credential, and prefs are plain-text XML on a rooted device.
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3 # non-secret preferences only

  # ── ui ───────────────────────────────────────────────────────────────────────
  flutter_screenutil: ^5.9.3
  google_fonts: ^7.0.0 # the generated theme's util.dart needs it
  cached_network_image: ^3.4.1

  # ── misc ─────────────────────────────────────────────────────────────────────
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  # ── map ──────────────────────────────────────────────────────────────────────
  # The map surface only — not a picker. Every ready-made OSM picker on pub.dev is a whole
  # *screen* carrying its own text fields, buttons and literal colours, which §7 does not allow,
  # and three of them (open_street_map_search_and_pick, osm_search_and_pick, map_picker_free)
  # are GPL-3.0 — linking one into a closed app obliges us to publish the whole app's source.
  # The strongest MIT one pins latlong2 0.9.x and drags in geolocator, an OS location permission
  # we do not need. flutter_map is what all of them depend on anyway, so we take it directly and
  # own the screen. BSD-3, fleaflet.dev, pure Dart; the only native code is a transitive
  # path_provider for the tile cache. No permission required.
  #
  # ⚠️ flutter_map_tile_caching is GPL-3.0 too. The day offline maps are asked for, the package
  # to reach for is flutter_map_cache (MIT) — not that one.
  flutter_map: ^8.3.1
  # flutter_map's LatLng type. Declared rather than used transitively, because our own code
  # names it — which is precisely what depend_on_referenced_packages exists to catch.
  latlong2: ^0.10.1
  # One floating button that opens into the two or three things a screen can do. Chosen over a
  # row of buttons or an overflow menu because the actions here are reversible and frequent —
  # edit, deactivate, designs — and an overflow menu hides them behind a glyph nobody presses.
  flutter_speed_dial: ^7.0.0

  # ── picking a customer's artwork ─────────────────────────────────────────────
  # Two pickers, not one, and that is not duplication. `file_picker` opens the system's document
  # browser — Files on iOS, the storage picker on Android — which is where a PDF sent by email
  # lands. `image_picker` opens the photo library and the camera, which is where a design sent
  # over WhatsApp lands, and on iOS the Files app cannot see that library at all. Offering only
  # the first would make the commonest case — «the customer sent it to me on WhatsApp» —
  # impossible.
  #
  # Both are what the sheet in core/widgets/attachment_sheet.dart puts behind its three rows.
  # `image_picker` is flutter.dev's own; `file_picker` is MIT.
  file_picker: ^11.0.3
  image_picker: ^1.2.3
  # Hands a design to whatever the phone already opens PDFs with.
  #
  # Deliberately not a PDF renderer: every one of them ships a native engine, and this app needs
  # to *show a file*, not to annotate one. The link is the signed URL the API mints per request,
  # so it expires — which is the point, since a design is the customer's property.
  url_launcher: ^6.3.2
  # ── saving a design onto the phone ───────────────────────────────────────────
  # «تحميل» is not a download button in a browser here: on a phone the file has to end up
  # somewhere the person can find it — Photos, Files, or straight into WhatsApp — and only the
  # operating system's own sheet knows which of those exist on this device. So the app fetches
  # the bytes, writes them to its temp directory, and hands that file to the share sheet, where
  # «حفظ الصورة» and «حفظ في الملفات» are rows the OS itself provides.
  #
  # Deliberately not a gallery-writing package (gal, image_gallery_saver): those need the photo
  # library permission on both platforms, cannot save a PDF at all, and would put a permission
  # prompt in front of a staff member who only wanted to forward the artwork to the printer.
  share_plus: ^12.0.2
  # Where that temp file goes. Already present transitively for flutter_map's tile cache;
  # declared because our own code names it, which is what `depend_on_referenced_packages` is for.
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the running app from tooling — see test_driver/app.dart. Development only: the
  # entry point that enables it lives outside lib/, so it cannot reach a release build.
  flutter_driver:
    sdk: flutter
  build_runner: ^2.4.15
  freezed: ^3.2.5
  json_serializable: ^6.9.5
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - .env.dev
    - assets/images/
    - assets/icons/
