name: dayaa
description: "دعاية Dayaa — إدارة مطبعة أكياس: العملاء، الطلبات، المخزون والحسابات."
publish_to: "none"

# major.minor.patch+build — the build number is what the stores order releases by.
version: 1.10.0+9

environment:
  sdk: ^3.12.0

# Every dependency is a decision. Nothing is added here "in case we need it" — a package that
# is not imported anywhere gets removed, because each one is code we ship, review and upgrade.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # نسخةُ المتصفّح: روابطُ بلا `#` (`usePathUrlStrategy` في main.dart). جزءٌ من Flutter نفسه،
  # ويُعلَن لأن كودنا يستورده — وهو ما تطلبه `depend_on_referenced_packages`.
  flutter_web_plugins:
    sdk: flutter

  # ── state ────────────────────────────────────────────────────────────────────
  flutter_bloc: ^9.1.0 # Cubit — the ViewModel layer
  get_it: ^8.0.3 # service locator

  # ── network ──────────────────────────────────────────────────────────────────
  dio: ^5.8.0+1
  # Debug builds only, whatever the flavour — see DioClient.logsTraffic. Bodies carry the
  # bearer token and real customer records, so a shipped build must never attach it.
  pretty_dio_logger: ^1.4.0

  # ── navigation ───────────────────────────────────────────────────────────────
  go_router: ^15.1.1

  # ── models ───────────────────────────────────────────────────────────────────
  freezed_annotation: ^3.1.0 # unions + immutable data
  json_annotation: ^4.12.0 # json_serializable warns on anything older
  dartz: ^0.10.1 # Either<Failure, T>

  # ── storage ──────────────────────────────────────────────────────────────────
  # The token lives in the Keychain / Android Keystore, not in SharedPreferences:
  # a bearer token is a credential, and prefs are plain-text XML on a rooted device.
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3 # non-secret preferences only

  # ── ui ───────────────────────────────────────────────────────────────────────
  flutter_screenutil: ^5.9.3
  google_fonts: ^7.0.0 # the generated theme's util.dart needs it
  cached_network_image: ^3.4.1


  # ── push notifications ───────────────────────────────────────────────────────
  # FCM HTTP v1, against the `daya-bdf70` Firebase project. `firebase_core` is not optional
  # padding around `firebase_messaging` — it is what reads google-services.json /
  # GoogleService-Info.plist and hands the messaging plugin a configured app; without it the
  # first `getToken()` throws rather than returning null.
  #
  # **No `flutter_local_notifications`.** It buys exactly one thing — a banner while the app is
  # already open on Android — and costs an icon asset, a second channel definition to keep in
  # step with the server's `dayaa_default`, and a second tap-handling path that must agree with
  # `onMessageOpenedApp`. The badge already updates on `onMessage`; a banner over a screen the
  # user is looking at is the weakest case for all that. Add it when someone asks for it.
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2

  # ── misc ─────────────────────────────────────────────────────────────────────
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  # ── map ──────────────────────────────────────────────────────────────────────
  # The map surface only — not a picker. Every ready-made OSM picker on pub.dev is a whole
  # *screen* carrying its own text fields, buttons and literal colours, which §7 does not allow,
  # and three of them (open_street_map_search_and_pick, osm_search_and_pick, map_picker_free)
  # are GPL-3.0 — linking one into a closed app obliges us to publish the whole app's source.
  # The strongest MIT one pins latlong2 0.9.x and drags in geolocator, an OS location permission
  # we do not need. flutter_map is what all of them depend on anyway, so we take it directly and
  # own the screen. BSD-3, fleaflet.dev, pure Dart; the only native code is a transitive
  # path_provider for the tile cache. No permission required.
  #
  # ⚠️ flutter_map_tile_caching is GPL-3.0 too. The day offline maps are asked for, the package
  # to reach for is flutter_map_cache (MIT) — not that one.
  flutter_map: ^8.3.1
  # flutter_map's LatLng type. Declared rather than used transitively, because our own code
  # names it — which is precisely what depend_on_referenced_packages exists to catch.
  latlong2: ^0.10.1
  # One floating button that opens into the two or three things a screen can do. Chosen over a
  # row of buttons or an overflow menu because the actions here are reversible and frequent —
  # edit, deactivate, designs — and an overflow menu hides them behind a glyph nobody presses.
  flutter_speed_dial: ^7.0.0

  # ── picking a customer's artwork ─────────────────────────────────────────────
  # Two pickers, not one, and that is not duplication. `file_picker` opens the system's document
  # browser — Files on iOS, the storage picker on Android — which is where a PDF sent by email
  # lands. `image_picker` opens the photo library and the camera, which is where a design sent
  # over WhatsApp lands, and on iOS the Files app cannot see that library at all. Offering only
  # the first would make the commonest case — «the customer sent it to me on WhatsApp» —
  # impossible.
  #
  # Both are what the sheet in core/widgets/attachment_sheet.dart puts behind its three rows.
  # `image_picker` is flutter.dev's own; `file_picker` is MIT.
  file_picker: ^11.0.3
  image_picker: ^1.2.3
  # `XFile` نفسه الذي يُعيده المنتقيان أعلاه، ويُستورد باسمه لأن `LocalFiles` يصنع منه ملفاً على
  # الويب: بايتاتٌ تصير رابط blob يُرفع ويُحفظ ويُعرض كما يُعامَل المسار على الهاتف. من فريق
  # Flutter نفسه، وهو في البناء أصلاً عبر المنتقيين.
  cross_file: ^0.3.5+4
  # ── إرفاق الصور في المحادثة، كبريمولا ─────────────────────────────────────────
  # ورقةُ تيليجرام في `core/chat/media_attach_sheet.dart`: صورُ الهاتف الأخيرة شبكةً تحت المحادثة،
  # تُختار مرقّمةً حتى عشرٍ وتُرسل رسالةً واحدة بتعليقها. `photo_manager` يقرأ المكتبة، وأخوه يرسم
  # الصورة المصغّرة — الإصداران اللذان في بريمولا. **يقرأ المكتبة فيسأل إذنها**: `READ_MEDIA_IMAGES`
  # على أندرويد ١٣ فما فوق و`READ_EXTERNAL_STORAGE` حتى ١٢، و`NSPhotoLibraryUsageDescription` على
  # آيفون (موجودٌ أصلاً). ومن رفض بقي له منتقي النظام في الورقة نفسها. يدعم Swift Package Manager.
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  # Hands a design to whatever the phone already opens PDFs with.
  #
  # Deliberately not a PDF renderer: every one of them ships a native engine, and this app needs
  # to *show a file*, not to annotate one. The link is the signed URL the API mints per request,
  # so it expires — which is the point, since a design is the customer's property.
  url_launcher: ^6.3.2
  # ── حفظ التصميم على الهاتف ─────────────────────────────────────────────────────
  # «تحميل» يحفظ ولا يشارك (طُلب ٢٠٢٦-١٠-١٢: كان الزرّ يفتح ورقة المشاركة). الصورة إلى «الصور»،
  # والـPDF إلى «التنزيلات» على أندرويد و«الملفات» على آيفون — بلا نافذةٍ يختار منها أحد.
  #
  # **`file_saver` لا `gal`**: `gal` يحفظ الصور وحدها، والتصاميم فيها PDF. وهذه تحفظ الاثنين،
  # وتدعم Swift Package Manager، ولا تضيف إلى أندرويد إلا `WRITE_EXTERNAL_STORAGE` حتى أندرويد ٩
  # (`maxSdkVersion=28`)؛ وأندرويد ١٠ فما فوق لا يسأل إذناً. على آيفون تسأل مرةً إذنَ **الإضافة**
  # إلى الصور وحده (`NSPhotoLibraryAddUsageDescription`)، لا قراءتها.
  file_saver: ^0.7.0
  # ورقة المشاركة نفسها، لما يُرسَل لا لما يُحفظ: الفاتورة، ورمز QR، ومعاينة الكيس.
  share_plus: ^12.0.2
  # Where that temp file goes. Already present transitively for flutter_map's tile cache;
  # declared because our own code names it, which is what `depend_on_referenced_packages` is for.
  path_provider: ^2.1.6
  # أيقوناتُ منصّات التواصل على روابط العميل — فيسبوك وإنستغرام وغيرهما، رسومٌ لا تملكها Material
  # ولا Cupertino. من فريق Flutter نفسه، دارت خالصة بلا كودٍ أصلي، وهي التي يستعملها تطبيق العميل.
  flutter_svg: ^2.3.0

  # ── the screen before the app ────────────────────────────────────────────────
  # A real dependency rather than a dev one, and `main.dart` is why: it holds the system's
  # splash over start-up and takes it down when the first Flutter frame is ready. The generator
  # half of the package writes into android/ and ios/ and is run by hand — see the
  # `flutter_native_splash:` block at the bottom of this file.
  flutter_native_splash: ^2.4.8
  pdf: ^3.13.0

  # ── الأدوات: رمز QR ──────────────────────────────────────────────────────────
  # المرمِّز وحده: بيور دارت، BSD-3، من kevmoo، وهو ما تقوم عليه كل حزم QR في pub.
  #
  # **وهو في شجرتنا أصلاً** — `pdf` ← `barcode` ← `qr` — فالسطر هنا لا يضيف كوداً نشحنه، بل
  # يسمّي ما نستورده بأنفسنا، وهو بالضبط ما وُجد `depend_on_referenced_packages` لأجله. ولهذا
  # القيد `^3.0.2` لا `^4`: `barcode` مثبَّت على `qr ^3.0.0`، ورفعُنا وحدنا يكسر الحلّ.
  #
  # **ولا `qr_flutter`.** هو ويدجت جاهز يحمل ألوانه وحوافه، و§7 لا تسمح بلون مكتوب في شاشة —
  # ونحتاج خلفية شفافة ولوناً يختاره الموظف، فالويدجت الجاهز يُلتفّ حوله لا يُستعمل. آخر إصدار
  # له ٢٠٢١. ما نحتاجه منه ثلاثون سطراً من `CustomPainter` نملكها ونختبرها — نفس قرار
  # `flutter_map` أعلاه وللسبب نفسه.
  qr: ^3.0.2
  # ── البثّ الحيّ ─────────────────────────────────────────────────────────────
  # عميلُ بروتوكول Pusher الذي يتكلمه Reverb — تذاكر الدعم حيّة. Dart خالصة بلا كودٍ أصلي، وناشرٌ
  # موثّق. لا تعرفه الشاشات: فوقه `RealtimeClient` في core/realtime، فلو تبدّلت الحزمة تبدّل ملفٌ واحد.
  # ولماذا مقابس لا سؤالٌ كل ثوانٍ ولا FCM: Docs/support/SUPPORT-REALTIME.md §١.
  dart_pusher_channels: ^1.3.1

  # ── الرسائل الصوتية في التذاكر الداخلية ───────────────────────────────────────
  # الثلاث نفسها التي في تطبيق موظفي بريمولا وبنسخها — المطلوب أن تكون التذاكر كما هي هناك
  # (INTERNAL-TICKETS-DESIGN §٣). `record` يسجّل AAC في m4a ويقيس الصوت للموجة؛ `just_audio`
  # يشغّل من الملف بعد أن ينزل مرّةً (core/voice/voice_note_cache.dart)؛ و`audio_session` يعيد
  # الهاتف من وضع التسجيل إلى مكبّر الصوت قبل كل تشغيل — بدونه يخرج الصوت خافتاً على iOS بعد
  # أول تسجيل. وكلّها خلف `core/voice/`: لا شاشةَ تعرف أيّ حزمة تسجّل.
  record: ^7.1.2
  just_audio: ^0.10.6
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the running app from tooling — see test_driver/app.dart. Development only: the
  # entry point that enables it lives outside lib/, so it cannot reach a release build.
  flutter_driver:
    sdk: flutter
  build_runner: ^2.4.15
  freezed: ^3.2.5
  json_serializable: ^6.9.5
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  # A generator, not a library: run by hand after the logo changes, and it writes into android/
  # and ios/. Nothing in lib/ imports it — unlike `flutter_native_splash`, which is a real
  # dependency because `main.dart` calls its `preserve`/`remove`.
  flutter_launcher_icons: ^0.14.4

# `file_saver` ≥0.5 يطلب `meta ^1.19.0`، وFlutter 3.44 يثبّت `meta 1.18.0` في `flutter_test`.
# والفرق بينهما لا يمسّ شيئاً: 1.19.0 يُخرج `@RecordUse` و`@mustBeConst` من «التجريبي» لا غير.
# **يُحذف هذا السطر** يوم يثبّت Flutter نفسه 1.19 أو أحدث — عندها لا عمل له.
dependency_overrides:
  meta: 1.19.0

flutter:
  uses-material-design: true

  assets:
    # One per Flavor, and both have to be listed: a flavour whose env file is not bundled
    # throws at launch rather than failing the build.
    - .env
    - .env.dev
    - assets/images/
    - assets/icons/
    # شعارات منصّات التواصل، من Simple Icons 13.21.0 (CC0): مسارٌ واحد أحادي اللون يُصبغ بلون المنصّة.
    - assets/icons/social/
    # صور الأكياس التي تُعاين عليها التصاميم، مأخوذة من `daaya.ly/preview.html` — نفس الصور
    # التي يراها الزبون على الموقع، فالمعاينة في التطبيق تُريه ما رآه هناك.
    - assets/mockups/
    # Not registered under `fonts:` — the app's own text is drawn by the system font. These are
    # bytes the PDF invoice embeds, because a generated PDF carries no fonts from the phone and
    # an invoice built without an Arabic face comes out a page of empty boxes. Almarai, OFL,
    # licence beside the files.
    - assets/fonts/

# ── the app's face ────────────────────────────────────────────────────────────────────────────
#
# One logo — `assets/images/logo.png` — behind three things: the launcher icon, the screen
# Android and iOS draw while the app is starting, and the brand mark on [SplashPage]. The first
# two are generated from the padded copies in `assets/branding/`, which `tool/make_branding_assets.py`
# derives; the file that ships and is drawn at runtime is the logo itself.
#
# After changing the logo:
#   python3 tool/make_branding_assets.py
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  # 1024, because that is the size iOS requires. See the note in the script about the master.
  image_path: assets/branding/icon_1024.png

  android: true
  # The masked layer gets the padded copy: a launcher may crop this to a circle, and the
  # unpadded logo loses its corners when it does.
  adaptive_icon_foreground: assets/branding/adaptive_foreground.png
  # The same surface the app opens on, so the icon does not flash a different white.
  adaptive_icon_background: "#f4fbfa"
  # الأرضية الحقيقية للتطبيق: `flutter.minSdkVersion` في Flutter 3.44 هو 24، لا 21. القيمة هنا
  # هي ما يقرّر به المولّد أن يكتب أيقونات mipmap القديمة بجانب التكيّفية — ودونها تخرج أجهزة
  # أندرويد 7 (API 24‑25، وهي دون 26) بأيقونة فارغة، لأن `mipmap-anydpi-v26` لا يراه إلا 26 فأعلى.
  min_sdk_android: 24

  ios: true
  # iOS refuses an icon with transparency — it renders as black. The logo's transparent
  # background is flattened onto the app's own surface colour instead of white, so the icon
  # matches the splash it opens into.
  remove_alpha_ios: true
  background_color_ios: "#f4fbfa"

flutter_native_splash:
  # The same two colours [SplashPage] uses for its background — `colorScheme.surface` in each
  # theme. The native screen and the Flutter one that replaces it are then the same picture on
  # the same background, so the handover is invisible instead of a flash.
  color: "#f4fbfa"
  color_dark: "#0e1514"
  image: assets/images/logo.png
  image_dark: assets/images/logo.png

  # Android 12 and up ignore the above and draw their own: a 768px circle on a 1152px canvas,
  # clipping anything outside it. That is what the padded copy is for.
  android_12:
    image: assets/branding/splash_android_12.png
    image_dark: assets/branding/splash_android_12.png
    color: "#f4fbfa"
    color_dark: "#0e1514"

  android: true
  ios: true
  # No web build of this app, and generating for it writes files nobody uses.
  web: false
